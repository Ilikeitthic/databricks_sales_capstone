resources:
  jobs:
    sales_job:
      name: sales_etl_job

      trigger:
        # Fires automatically whenever a new file lands in the volume folder.
        # pause_status must be UNPAUSED — dev mode pauses triggers by default.
        pause_status: UNPAUSED
        file_arrival:
          url: /Volumes/workspace/default/sales_data/
          min_time_between_triggers_seconds: 60   # 1 minute cool-down
          wait_after_last_change_seconds: 60        # wait 60 s after last write before firing

      environments:
        - environment_key: serverless
          spec:
            client: "2"

      tasks:
        - task_key: data_quality_report
          environment_key: serverless
          notebook_task:
            notebook_path: ../src/00_data_quality_report.ipynb
            source: WORKSPACE

        - task_key: bronze_ingestion
          depends_on:
            - task_key: data_quality_report
          environment_key: serverless
          notebook_task:
            notebook_path: ../src/01_bronze_ingestion.ipynb
            source: WORKSPACE

        - task_key: silver_cleaning
          depends_on:
            - task_key: bronze_ingestion
          environment_key: serverless
          notebook_task:
            notebook_path: ../src/02_silver_cleaning.ipynb
            source: WORKSPACE

        - task_key: gold_analytics
          depends_on:
            - task_key: silver_cleaning
          environment_key: serverless
          notebook_task:
            notebook_path: ../src/03_gold_analytics.ipynb
            source: WORKSPACE
