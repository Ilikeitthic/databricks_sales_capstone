resources:
  jobs:
    sales_job:
      name: sales_etl_job

      job_clusters:
        - job_cluster_key: sales_cluster
          new_cluster:
            spark_version: "14.3.x-scala2.12"
            node_type_id: i3.xlarge
            num_workers: 1

      tasks:
        - task_key: data_quality_report
          job_cluster_key: sales_cluster
          notebook_task:
            notebook_path: ../src/00_data_quality_report.ipynb
            source: WORKSPACE

        - task_key: bronze_ingestion
          depends_on:
            - task_key: data_quality_report
          job_cluster_key: sales_cluster
          notebook_task:
            notebook_path: ../src/01_bronze_ingestion.ipynb
            source: WORKSPACE

        - task_key: silver_cleaning
          depends_on:
            - task_key: bronze_ingestion
          job_cluster_key: sales_cluster
          notebook_task:
            notebook_path: ../src/02_silver_cleaning.ipynb
            source: WORKSPACE

        - task_key: gold_analytics
          depends_on:
            - task_key: silver_cleaning
          job_cluster_key: sales_cluster
          notebook_task:
            notebook_path: ../src/03_gold_analytics.ipynb
            source: WORKSPACE
